[package]
name = "agileplus-bdd"
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[[test]]
name = "bdd"
harness = false
path = "main.rs"

[[test]]
name = "fixtures"
harness = true
path = "fixtures_test.rs"

[dependencies]
agileplus-domain = { path = "../../agileplus/crates/agileplus-domain" }
cucumber = "0.21"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tempfile = "3"
