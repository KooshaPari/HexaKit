on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      channel:
        required: true
        type: string
      risk_profile:
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Gate Check



permissions:
  contents: read
jobs:
  gate-check:
    runs-on: ubuntu-24.04
    env:
      LANGUAGE: ${{ inputs.language }}
      CHANNEL: ${{ inputs.channel }}
      RISK_PROFILE: ${{ inputs.risk_profile }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925

      - name: Run lint
        run: mise run lint
        continue-on-error: false

      - name: Run test
        run: mise run test
        continue-on-error: false

      - name: Run security audit
        if: ${{ inputs.channel == 'beta' || inputs.channel == 'stable' || inputs.risk_profile == 'high' }}
        run: mise run audit
        continue-on-error: false

      - name: Gate check result
        run: |
          echo "✓ Gate check passed for $LANGUAGE"
          echo "  Channel: $CHANNEL"
          echo "  Risk profile: $RISK_PROFILE"
