on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      channel:
        required: true
        type: string
      risk_profile:
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Gate Check



permissions:
  contents: read
jobs:
  gate-check:
    runs-on: ubuntu-24.04
    env:
      LANGUAGE: ${{ inputs.language }}
      CHANNEL: ${{ inputs.channel }}
      RISK_PROFILE: ${{ inputs.risk_profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea

      - name: Run lint
        run: mise run lint
        continue-on-error: false

      - name: Run test
        run: mise run test
        continue-on-error: false

      - name: Run security audit
        if: ${{ inputs.channel == 'beta' || inputs.channel == 'stable' || inputs.risk_profile == 'high' }}
        run: mise run audit
        continue-on-error: false

      - name: Gate check result
        run: |
          echo "✓ Gate check passed for $LANGUAGE"
          echo "  Channel: $CHANNEL"
          echo "  Risk profile: $RISK_PROFILE"
