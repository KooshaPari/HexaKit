on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      registry:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false
      PYPI_TOKEN:
        required: false
      CARGO_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Publish Package



permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925

      - name: Build
        run: mise run build

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          REGISTRY: ${{ inputs.registry }}
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          case "$REGISTRY" in
            npm) npm publish --tag "$VERSION" ;;
            pypi) twine upload dist/* ;;
            crates.io) cargo publish ;;
          esac

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          LANGUAGE: ${{ inputs.language }}
          REGISTRY: ${{ inputs.registry }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "Dry run: Would publish $LANGUAGE package version $VERSION to $REGISTRY"
