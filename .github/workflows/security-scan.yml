on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_call:
    inputs:
      workspace:
        required: false
        type: string
        default: '.'
      cargo-audit:
        required: false
        type: boolean
        default: true
      cargo-deny:
        required: false
        type: boolean
        default: true
      gitleaks:
        required: false
        type: boolean
        default: true
      python-bandit:
        required: false
        type: boolean
        default: false
      bandit-path:
        required: false
        type: string
        default: '.'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Security Scan



jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-env
        with:
          rust-version: stable
          checkout-depth: '0'
          workspace: ${{ inputs.workspace }}

      - uses: ./.github/actions/security-checks
        with:
          cargo-audit: ${{ inputs.cargo-audit }}
          cargo-deny: ${{ inputs.cargo-deny }}
          gitleaks: ${{ inputs.gitleaks }}
          python-bandit: ${{ inputs.python-bandit }}
          bandit-path: ${{ inputs.bandit-path }}
          working-directory: ${{ inputs.workspace }}

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [cpp, python, ruby]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938

  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-env
        with:
          rust-version: stable
          workspace: ${{ inputs.workspace }}

      - name: Generate Cargo.lock
        working-directory: ${{ inputs.workspace }}
        run: cargo generate-lockfile

      - name: Install OSV-Scanner
        env:
          OSV_VERSION: v2.3.5
        run: |
          curl -fsSL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner

      - name: OSV-Scanner
        id: osv
        run: |
          cd ${{ inputs.workspace }}
          osv-scanner scan -L Cargo.lock --format sarif --output-file osv-results.sarif

      - name: Upload OSV SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: ${{ inputs.workspace }}/osv-results.sarif
          category: osv-cargo-lock

      - name: OSV table output
        if: failure() && steps.osv.outcome == 'failure'
        working-directory: ${{ inputs.workspace }}
        run: osv-scanner scan -L Cargo.lock --format table
