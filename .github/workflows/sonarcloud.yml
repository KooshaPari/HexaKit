on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

name: SonarCloud
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true




permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SonarScanner
        run: |
          curl -sSfL https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.9.0.2725-linux.zip -o sonar.zip
          unzip sonar.zip
          echo "$PWD/sonar-scanner-4.9.0.2725/bin" >> "$GITHUB_PATH"
      - name: Run SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=${{ github.repository }} \
            -Dsonar.organization=kooshapari \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
