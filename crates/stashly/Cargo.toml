[package]
name = "stashly"
version.workspace = true
edition.workspace = true
authors = ["Phenotype Team"]
description = "Universal caching abstraction with TTL, multi-tier, and singleflight support"
license.workspace = true
repository = "https://github.com/KooshaPari/Stashly"
documentation = "https://docs.rs/stashly"
keywords = ["cache", "caching", "memory", "redis", "ttl", "tiered", "singleflight"]
categories = ["caching", "data-structures"]
rust-version.workspace = true

[dependencies]
# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Caching — pinned standalone (workspace has older lru/dashmap; tracked for upgrade)
lru = "0.17"
dashmap = "6.1"
parking_lot = { workspace = true }

# HashMap for hashing
hashlink = "0.11"

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }

[profile.release]
lto = true
codegen-units = 1

[[bench]]
name = "perf"
harness = false
