[package]
name = "stashly"
version.workspace = true
edition.workspace = true
description = "Universal caching abstraction with TTL, multi-tier, and singleflight support"
repository = "https://github.com/KooshaPari/HexaKit"
documentation = "https://docs.rs/stashly"
keywords = ["cache", "caching", "memory", "redis", "ttl", "tiered", "singleflight"]
categories = ["caching", "data-structures"]
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors = ["kooshapari"]

[dependencies]
# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Caching — pinned standalone (workspace has older lru/dashmap; tracked for upgrade)
lru = "0.17"
dashmap = "6.1"
parking_lot = { workspace = true }

# HashMap for hashing
hashlink = "0.11"

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "perf"
harness = false
