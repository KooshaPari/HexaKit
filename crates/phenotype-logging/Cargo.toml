[package]
name = "phenotype-logging"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

opentelemetry = "0.27"
opentelemetry_sdk = "0.27"
opentelemetry-otlp = "0.27"
tracing-opentelemetry = "0.28"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full"] }
