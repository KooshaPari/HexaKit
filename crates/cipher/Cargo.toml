[package]
name = "phenotype-cipher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Simple, safe cryptography (AES-GCM, ChaCha20, Ed25519, Argon2) for Phenotype"

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
zstd = { workspace = true }
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
blake2 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
subtle = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[profile.release]
lto = true
codegen-units = 1

[[bench]]
name = "cipher_bench"
harness = false

# Strict linting for the cipher crate. `pedantic` is enabled at `allow` level
# so that it shows up in `cargo clippy` output as a TODO marker (i.e. easy
# to find when triaging) without breaking the build. Use module-level
# `#[allow]` / `#[warn]` attributes to surface individual lints as warnings
# while you work through them.
[lints.clippy]
pedantic = { level = "allow", priority = -1 }
